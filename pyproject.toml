[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmsar"
version = "0.1.0"
description = "Graph-coordinated drone swarm framework for search-and-rescue: real-time mesh, human-presence mapping, pluggable AI, rescue alerting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joaquim Pedro de Morais Filho" }]
maintainers = [{ name = "Joaquim Pedro de Morais Filho" }]
keywords = [
    "drone",
    "uav",
    "swarm",
    "search-and-rescue",
    "sar",
    "multi-agent",
    "mesh-network",
    "sensor-fusion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/elevbit-ai/swarm-sar"
Repository = "https://github.com/elevbit-ai/swarm-sar"
Issues = "https://github.com/elevbit-ai/swarm-sar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmsar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
